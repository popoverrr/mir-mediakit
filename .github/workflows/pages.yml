# Превью медиакита на GitHub Pages: https://<логин>.github.io/<репозиторий>/
# Сборка с base = /<репозиторий>/ (все пути к медиа и ассетам учитывают base).
# Settings → Pages → Source: «GitHub Actions».
# Pages на бесплатном плане работает только для публичного репозитория, поэтому в приватном
# workflow пропускается (без ошибок); после смены видимости на Public — собирается на каждый push.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build
        run: |
          REPO="${GITHUB_REPOSITORY#*/}"
          OWNER="$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          if [[ "$REPO" == *.github.io ]]; then BASE="/"; else BASE="/$REPO/"; fi
          echo "site=https://$OWNER.github.io base=$BASE"
          MIR_SITE="https://$OWNER.github.io" MIR_BASE="$BASE" npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
